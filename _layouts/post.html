---
layout: default
---
<article class="wrap read">
  <div class="kick">{{ page.date | date: "%B %Y" }} · {% include read-time.html content=content %}</div>
  <h1>{{ page.title }}</h1>
  <div class="by">{{ site.author.short_name }}</div>
  <div class="prose">
    {{ content }}
  </div>
  <nav class="back" aria-label="More writing">
    <a href="{{ '/personal/' | relative_url }}">← All writing</a>
    {%- if page.previous %}
    <a href="{{ page.previous.url | relative_url }}">{{ page.previous.title }} →</a>
    {%- elsif page.next %}
    <a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>
    {%- endif %}
  </nav>
</article>
