# Projects page and homepage "Current work" read from this file.
# Text fields are the maintainer's own words (GitHub descriptions or existing site text): copy, never write.
#   featured: big cards (homepage + top of /projects/). `docs:` adds a Docs button once a docs site exists.
#             `topics` are the curated card tags agreed with the maintainer (5 each, `mcp` shared); mirror them
#             on the repos' GitHub topics when those change.
#   list:     one-line rows. `docs:` adds a Docs button once a docs site exists.
#   models:   Hugging Face models, linked once through the collection.

featured:
