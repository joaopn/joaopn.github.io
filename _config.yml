# No theme: layouts live in _layouts/, styles in assets/css/site.css

# Site Settings
locale                   : "en-US"
title                    : "joaopn.github.io"
name                     : &name "Joao P. Neto, PhD"
description              : &description "Website of Joao Pinheiro Neto"
url                      : "https://joaopn.github.io"
baseurl                  : ""
repository               : "joaopn/joaopn.github.io"
words_per_minute         : 160
future                   : true

# Site Author
author:
  name             : "Joao P. Neto, PhD"
  short_name       : "Joao P. Neto"
  avatar           : "/images/profile.jpeg"
  bio              : "Computational Physicist<br>AI &amp; Data"
  location         : "Vienna, Austria"
  links:
    - label: "Google Scholar"
      icon: "google-scholar"
      url: "https://scholar.google.de/citations?user=nq61A04AAAAJ&hl"
      footer: true
    - label: "GitHub"
      icon: "github"
      url: "https://github.com/joaopn"
      footer: true
    - label: "Bluesky"
      icon: "bluesky"
      url: "https://bsky.app/profile/joaopn.bsky.social"
      footer: true
    - label: "LinkedIn"
      icon: "linkedin"
      url: "https://www.linkedin.com/in/joao-pinheiro-neto-45b649171/"
    - label: "Hugging Face"
      icon: "robot"
      url: "https://huggingface.co/joaopn"

# Reading Files
include:
  - _pages
exclude:
  - .bundle
  - .github
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - README.md
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Collections
collections:
  teaching:
    output: false
  research:        # area cards on /research/
    output: false
  areas:           # area texts opened from the /research/ filters
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: /personal/
  - scope:
      path: ""
    values:
      layout: page

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

